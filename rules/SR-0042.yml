uid: SR-0042
type: system_requirement
status: approved
title: Allocate against the pointer, not the spelt-out type
text: >-
  Allocate a structure with the dereferenced pointer form, such as p = kmalloc(sizeof(*p),
  ...), so the size stays correct if the pointer type changes.
links:
- target: UR-0013
  type: implements
