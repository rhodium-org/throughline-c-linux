uid: SR-0021
type: system_requirement
status: approved
title: Do not typedef structures or pointers
text: >-
  Do not use a typedef for a structure or a pointer; refer to it as struct foo so the
  reader can see it is a structure.
links:
- target: UR-0005
  type: implements
attrs:
  source_ref: "Linux Kernel Coding Style: Typedefs"
