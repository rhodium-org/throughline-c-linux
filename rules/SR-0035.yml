uid: SR-0035
type: system_requirement
status: approved
title: Reference-count a shared data structure
text: >-
  Give any data structure visible beyond a single-threaded create-and-destroy context a
  reference count, because the kernel has no garbage collector and any other thread that
  can find it without a reference is almost certainly a bug.
links:
- target: UR-0010
  type: implements
attrs:
  source_ref: "Linux Kernel Coding Style: Data Structures"
