uid: SR-0027
type: system_requirement
status: approved
title: Order the elements of a declaration consistently
text: >-
  Order the elements of a function declaration consistently: storage class, storage-class
  attributes, return type, return-type attributes, name, parameters, then parameter and
  behaviour attributes.
