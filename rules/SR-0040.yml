uid: SR-0040
type: system_requirement
status: proposed
title: Keep kernel messages correctly spelt and concise
text: Spell kernel messages correctly and keep them concise, clear and unambiguous;
  a message need not end with a period, and avoid printing a bare number in parentheses.
normative: true
