uid: SR-0037
type: system_requirement
status: approved
title: Wrap a multi-statement macro in do { } while (0)
text: >-
  Enclose a multi-statement macro in a do { ... } while (0) block so it behaves like a
  single statement, and prefer an inline function to a function-like macro.
links:
- target: UR-0011
  type: implements
attrs:
  source_ref: "Linux Kernel Coding Style: Macros, Enums and RTL"
